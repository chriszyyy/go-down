plugins {
    // If you are changing the Android Gradle Plugin version, make sure it is compatible with the Gradle version preinstalled with Unity
    // See which Gradle version is preinstalled with Unity here https://docs.unity3d.com/Manual/android-gradle-overview.html
    // See official Gradle and Android Gradle Plugin compatibility table here https://developer.android.com/studio/releases/gradle-plugin#updating-gradle
    // To specify a custom Gradle version in Unity, go do "Preferences > External Tools", uncheck "Gradle Installed with Unity (recommended)" and specify a path to a custom Gradle version
    id 'com.android.application' version '7.1.2' apply false
    id 'com.android.library' version '7.1.2' apply false
    **BUILD_SCRIPT_DEPS**
}

subprojects {
    configurations.all {
        // Unity 2022.3.30f1c1 built-in Android SDK compiles with android-32.
        // Google Mobile Ads 9.2 / Android SDK 23.2 may request newer AndroidX artifacts;
        // lock them to compileSdk-32-compatible versions for all modules, including :launcher.
        resolutionStrategy.force 'androidx.browser:browser:1.4.0'
        resolutionStrategy.force 'androidx.webkit:webkit:1.5.0'
        resolutionStrategy.force 'androidx.core:core:1.6.0'
        resolutionStrategy.force 'androidx.core:core-ktx:1.6.0'
        resolutionStrategy.force 'androidx.annotation:annotation-experimental:1.1.0'
        exclude group: 'androidx.privacysandbox.ads', module: 'ads-adservices'
        exclude group: 'androidx.privacysandbox.ads', module: 'ads-adservices-java'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
